# MLX-LM LoRA config for Phi-3.5-mini-instruct
# Usage: python -m mlx_lm.lora --config scripts/lora_config_phi35.yaml

model: "microsoft/Phi-3.5-mini-instruct"
train: true
data: "data"                      # directory containing train.jsonl and valid.jsonl

# LoRA hyperparameters
num_layers: 8                     # number of transformer layers to attach adapters to
lora_parameters:
  rank: 8
  alpha: 16
  dropout: 0.0
  scale: 10.0

# Training
batch_size: 1
iters: 1000                       # full run; use 300 for quick proof-of-concept
val_batches: 50
learning_rate: 1.0e-4
steps_per_report: 50
steps_per_eval: 200
save_every: 200
adapter_path: "adapters/phi35"

# Generation (used during eval inside mlx_lm)
max_seq_length: 2048
